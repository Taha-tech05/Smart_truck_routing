# Render Blueprint: one Docker web service for the Django backend.
services:
  - type: web
    name: truck-weather-router-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        sync: false          # you enter it in the Render dashboard
      - key: ORS_API_KEY
        sync: false          # you enter it in the Render dashboard
      - key: DEBUG
        value: "False"
      - key: HTTPS_ONLY
        value: "True"
      # Placeholders: edit in the dashboard after the first deploy (see DEPLOY.md).
      - key: ALLOWED_HOSTS
        value: your-api-name.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app
